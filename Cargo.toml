[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/filesystem",
    "crates/langtool",
    "crates/language",
    "crates/server",
    "crates/testkit",
    "crates/toolchain",
    "crates/workflow",
    "stateful-agent",
    "stateful-agent-proxy",
]
# The proxy is a separate product: built and tested with `-p stateful-agent-proxy`.
default-members = [
    "crates/common",
    "crates/filesystem",
    "crates/langtool",
    "crates/language",
    "crates/server",
    "crates/testkit",
    "crates/toolchain",
    "crates/workflow",
    "stateful-agent",
]

[workspace.package]
version = "0.2.0"
authors = ["SnowyField"]
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
stateful-agent-common = { path = "crates/common" }
stateful-agent-filesystem = { path = "crates/filesystem" }
stateful-agent-langtool = { path = "crates/langtool" }
stateful-agent-language = { path = "crates/language" }
stateful-agent-server = { path = "crates/server" }
stateful-agent-testkit = { path = "crates/testkit" }
stateful-agent-toolchain = { path = "crates/toolchain" }
stateful-agent-workflow = { path = "crates/workflow" }
stateful-agent = { path = "stateful-agent" }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4"
regex = "1.11.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "0.8"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
