[package]
name = "proxied-agent-mcp"
version = "0.1.0"
edition = "2024"
description = "Drop-in hot-reloading proxy for agent-mcp"
license = "LGPL-3.0-or-later"

[[bin]]
name = "proxied-agent-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process"] }